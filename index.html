<!DOCTYPE html>
<html>
<head>
  <title>Portal Game</title>
  <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    
#map {
  height: 100dvh;
  width: 100%;
}
  
/* ===== HUD CONTAINER ===== *//* ===== HUD CONTAINER ===== */
.hud {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;

  width: min(92%, 600px);

  /* KEY CHANGE: no blur, slightly stronger opacity */
  background: rgba(210, 230, 210, 0.85);

  border-radius: 16px;
  border: 1px solid rgba(0,0,0,0.15);

  box-shadow: 0 4px 10px rgba(0,0,0,0.15);

  padding: 10px;
}
    /* ===== GRID ===== */
.grid-container {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 6px;

  /* subtle inner border instead of thick frame */
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
}

/* ===== GRID ITEMS ===== */
.grid-item {
  background: rgba(255,255,255,0.25);
  padding: 6px 8px;

  border-radius: 10px;
  border: 1px solid rgba(0,0,0,0.1);

  font-size: 18px;
  font-weight: 600;
}

/* ===== PLAYER INFO ===== */
.player-info {
  display: flex;
  flex-direction: column;
  justify-content: center;

  line-height: 1.2;
  border-left: 3px solid #4a90e2;
  padding-left: 6px;
}

/* ===== FULL ROWS ===== */
.full-row {
  grid-column: 1 / -1;
  text-align: center;
  font-weight: 700;

  border-top: 1px solid rgba(0,0,0,0.08);
}

/* ===== DRONE CELL ===== */
.drone-cell {
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

/* ===== DRONE BUTTON ===== */
#droneButton {
  appearance: none;
  -webkit-appearance: none;

  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid rgba(0,0,0,0.25);
  background: rgba(255,255,255,0.4);

  cursor: pointer;
}  padding: 6px 10px;

  border-radius: 8px;
  border: 1px solid rgba(0,0,0,0.25);

  background: rgba(255,255,255,0.4);

  cursor: pointer;
  transition: background 0.2s ease;
}

#droneButton:hover {
  background: rgba(255,255,255,0.6);
}

/* READY STATE */
#droneButton.ready {
  border-color: #2e7d32;
  background: rgba(200, 255, 200, 0.5);
}

/* ===== DRONE CONTROLS ===== */
#droneControls {
  visibility: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ===== ENERGY BAR STYLE ===== */
#playerEnergy {
  font-size: 20px;
  padding: 10px;

  background: linear-gradient(
    to right,
    rgba(255, 235, 59, 0.25),
    rgba(255, 235, 59, 0.05)
  );
}

/* ===== XP BAR STYLE ===== */
#playerXP {
  font-size: 20px;
  padding: 10px;

  background: linear-gradient(
    to right,
    rgba(33, 150, 243, 0.25),
    rgba(33, 150, 243, 0.05)
  );
}

/* ===== MOBILE ===== */
@media (max-width: 480px) {
  .hud {
    width: 95%;
    padding: 8px;
  }

  .grid-item {
    font-size: 13px;
    padding: 5px 6px;
  }

  #droneButton {
    padding: 5px 8px;
  }
}

</style>
</head>

<body>

<div id="map"></div>

<div class="hud">
  <div class="grid-container">

    <!-- Row 1 -->
    <div class="grid-item player-info">
      <div id="playerName">John</div>
      <div id="playerFaction">Skylords</div>
    </div>

    <!-- Drone controls (hidden for now) -->
    <div class="grid-item" id="droneControls">
      DRONE IS ACTIVE
    </div>

    <!-- Drone button -->
    <div class="grid-item drone-cell">
    <button id="droneButton" type="button">DRONE</button></div>


    <div class="grid-item full-row" id="playerEnergy">
    <span class="label">Energy:</span>
    <span class="value" id="energyValue">50000</span>
    </div>

   <div class="grid-item full-row" id="playerXP">
   <span class="label">XP:</span>
   <span class="value" id="xpValue">0</span>
   </div>
    <!-- Row 4 -->
    <div class="grid-item full-row" id="status">Ready</div>

  </div>
</div>
  
<script>
var player = {
    name: "",
    player_faction: "",
    energy: 0,
    experience: 0 
};
var gameState = {
  droneDeployed: false
};
  
function canUseDrone() {
  return player.energy >= 50000 && player.level >= 3;
}

function updateDroneButton() {
  const btn = document.getElementById("droneButton");

  if (canUseDrone()) {
    btn.classList.add("ready");
    btn.textContent = "Drone Ready";
  } else {
    btn.classList.remove("ready");
    btn.textContent = "Drone";
  }
}

document.getElementById("droneButton").addEventListener("click", () => {
  const status = document.getElementById("status");

  // Toggle OFF
  if (gameState.droneDeployed) {
    gameState.droneDeployed = false;
    status.textContent = "DRONE RETURNED";
    controls.style.visibility = gameState.droneDeployed ? "visible" : "hidden";     
  return;
  }

  // Check eligibility using player data
  if (!canUseDrone()) {
    if (player.energy < 50000) {
      status.textContent = "Need 50,000 energy.";
    } else if (player.level < 3) {
      status.textContent = "Reach Level 3 to unlock drone.";
    }
    return;
  }  
  alert("we are deploying dude");
  gameState.droneDeployed = true;
  status.textContent = "DRONE DEPLOYED";
  controls.style.visibility = gameState.droneDeployed ? "visible" : "hidden"; 
}
  
document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("droneButton");
    btn.style.visibility = "visible";   
    btn.style.display = "block";
 
});
  
var myplayerfaction; playerName;
let data = null;
 const map = L.map('map').setView([41.4, -75.7], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
}).addTo(map);


// Get player info once on load 
  async function loadPlayer() {
  const res = await fetch('/player');
  player = await res.json();
  console.log(player);
  document.getElementById("playerName").innerText = player.name;
  document.getElementById("playerFaction").innerText = player.player_faction;
  document.getElementById("energyValue").innerText = player.energy;
  document.getElementById("xpValue").innerText = player.experience;   
    
  myplayerfaction = player.player_faction; 
  playerName = player.name;
  setLevel();  
  updateDroneButton(); 
  }  

  function setLevel() {
  switch (true) {
  case (player.experience < 1000):
    player.level = 1;
    break; // Stops execution and exits the switch
  case (player.experience < 5000):
    player.level = 2;
    break;
  case (player.experience < 10000):
    player.level = 3;
    break; // Stops execution and exits the switch
  case (player.experience < 50000):
    player.level = 4;
    break;
  case (player.experience < 100000):
    player.level = 5;
    break; // Stops execution and exits the switch
  case (player.experience < 500000):
    player.level = 6;
    break;     
  case (player.experience < 1000000):
    player.level = 7;
    break;      
  default:
    // Runs if no cases match
    player.level = 8;
   }
 }
loadPlayer();

let playerLat = 41.4089;
let playerLon = -75.6624;
playLat = 41.3600; 
playerLon = -75.7898;
flag = "down";  
let radius = .001;  

let portalLayer = L.layerGroup().addTo(map);
let playerMarker = null;
var saveportals = [];  
let t = 0;

//setInterval(loadPortals, 60000);
  
function distance(lat1, lon1, lat2, lon2) {
  return (lat1 - lat2)**2 + (lon1 - lon2)**2;
}

async function capture(portalId) {

  if (playerLat == null || playerLon == null) {
    document.getElementById("status").innerText = "No location";
    return;
  }

  try {
      const res = await fetch(
  `/capture?portal_id=${portalId}&lat=${playerLat}&lon=${playerLon}&faction=${myplayerfaction}&owner=${playerName}`
  );  

    data = await res.json();
    console.log(data);

    document.getElementById("status").innerText = data.status;

    await loadPortals(); // refresh map after capture
    await loadPlayer();

  } catch (err) {
    document.getElementById("status").innerText = "Error contacting server";
    console.error(err);
  }
}
  
function canCapture(p) {
  if (playerLat === null || playerLon === null) return false;

  // cannot capture your own faction
  if (p.controlled_by === myplayerfaction) return false;

  const d = distance(playerLat, playerLon, p.lat, p.lon);

  return d < 0.0005;
}
  

function updatePlayerMarker() {
  /*
  if (flag == "up") {
      playerLat += .005;
      if (playerLat > 41.3600) flag = "down";
  } else {
      playerLat -= .005;
      if (playerLat < 41.2800) flag = "up";
  }
  */
  
    /*
    playerLat += radius * Math.cos(t);
    playerLon += radius * Math.sin(t);
    t += 0.4;
    */
 
/*
        navigator.geolocation.getCurrentPosition(pos => {
        playerLat = pos.coords.latitude;
        playerLon = pos.coords.longitude;
*/
        if (!playerMarker) {
           playerMarker = L.marker([playerLat, playerLon]).addTo(map);
        } else {
           playerMarker.setLatLng([playerLat, playerLon]);
        }
        recalcPortalEligibility();
}

  function recalcPortalEligibility() {
      data.portals.forEach(p => {
      const eligible = canCapture(p);
        const color =
          p.controlled_by === "Knights" ? "red" :
          p.controlled_by === "Skylords" ? "blue" :
          p.controlled_by === "Elves" ? "green" :
          "gray";
      
        if (eligible) {
           p.marker.setStyle({ fillColor: 'gold', radius: 12, weight: 6 });              
           let newHTML = `
             Name ${p.portal_name}<br>
             Owner ${p.portal_owner}<br>
             Faction: ${p.controlled_by || "none"}<br>
             `;
             newHTML += `<button onclick="capture(${p.id})">Capture</button>`;
             p.marker.setPopupContent(newHTML);    

      } else {

              p.marker.setStyle({ fillColor: color, radius: 10, weight: 2 }); // or faction color
              let newHTML = `
              Name ${p.portal_name}<br>
              Owner ${p.portal_owner}<br>
              Faction: ${p.controlled_by || "none"}<br>
              `;

              p.marker.setPopupContent(newHTML);
        } // eligible if then else
        
      }); // for each loop
  } // end of function def
  
async function loadPortals() {
  const res = await fetch('/state');
  data = await res.json();

  portalLayer.clearLayers();
  data.portals.forEach(p => {

    if (p.lat == null || p.lon == null) return;
    const eligible = canCapture(p);
    
    const color =
      p.controlled_by === "Knights" ? "red" :
      p.controlled_by === "Skylords" ? "blue" :
      p.controlled_by === "Elves" ? "green" :
      "gray";

  
  const marker = L.circleMarker([p.lat, p.lon], {
      radius: eligible ? 12 : 10,
      color: color,
      weight: eligible ? 6 : 2,
      fillColor: color,
      fillOpacity: 0.8
  }).addTo(portalLayer);

    if (eligible) {
       marker.setStyle({ fillColor: 'gold' });    }  
    
    let popupHTML = `
      Name ${p.portal_name}<br>
      Owner ${p.portal_owner}<br>
      Faction: ${p.controlled_by || "none"}<br>
    `;

    if (canCapture(p)) {
      popupHTML += `<button onclick="capture(${p.id})">Capture</button>`;
    }

    marker.bindPopup(popupHTML);
    p.marker = marker;
  });
  console.log(data.portals);
  setInterval(updatePlayerMarker, 5000);
}

loadPortals();  
</script>

</body>
</html>
