<!DOCTYPE html>
<html>
<head>
  <title>Portal Game</title>
  <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    
#map {
  height: 100dvh;
  width: 100%;
}
    
#ui {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;

  width: 92%;
  max-width: 420px;

  padding: 16px;

  border-radius: 18px;

  background:
    linear-gradient(
      to bottom,
      rgba(25,25,35,0.92),
      rgba(10,10,18,0.95)
    );

  border: 1px solid rgba(0,255,255,0.25);

  box-shadow:
    0 0 20px rgba(0,255,255,0.15),
    0 8px 30px rgba(0,0,0,0.45);

  backdrop-filter: blur(10px);

  color: white;
  font-family: Arial, sans-serif;
}

.hud-header {
  margin-bottom: 14px;
}

#playerName {
  font-size: 22px;
  font-weight: bold;
  color: #00ffff;
  text-shadow: 0 0 8px rgba(0,255,255,0.6);
}

#playerFaction {
  margin-top: 4px;
  font-size: 14px;
  color: #bbbbbb;
}

.stat-bar {
  display: flex;
  justify-content: space-between;

  margin-top: 10px;
  padding: 10px 12px;

  border-radius: 10px;

  background: rgba(255,255,255,0.06);

  border: 1px solid rgba(255,255,255,0.08);
}

.stat-bar span:first-child {
  color: #aaaaaa;
}

.stat-bar span:last-child {
  font-weight: bold;
  color: #ffffff;
}

#status {
  margin-top: 14px;

  padding: 10px;

  border-radius: 10px;

  background: rgba(0,255,120,0.15);
  border: 1px solid rgba(0,255,120,0.35);

  color: #66ff99;
  font-weight: bold;
  text-align: center;
  letter-spacing: 1px;
}    
 </style>
</head>

<body>
<div id="map"></div>
<div id="ui">
  <div class="hud-header">
    <div id="playerName">John</div>
    <div id="playerFaction">Skylords</div>
  </div>

  <div class="stat-bar">
    <span>⚡ Energy</span>
    <span id="playerEnergy">87</span>
  </div>

  <div class="stat-bar">
    <span>⭐ XP</span>
    <span id="playerXP">1240</span>
  </div>

  <div id="status">READY</div>
</div><script>

var myplayerfaction; playerName;
 const map = L.map('map').setView([41.4, -75.7], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
}).addTo(map);


// Get player info once on load 
  async function loadPlayer() {
  const res = await fetch('/player');
  const player = await res.json();
  console.log(player);
  document.getElementById("playerName").innerText = player.name;
  document.getElementById("playerFaction").innerText = player.player_faction;
  document.getElementById("playerEnergy").innerText = player.energy;
  document.getElementById("playerXP").innerText = player.experience;
  myplayerfaction = player.player_faction; 
  playerName = player.name;
  }  
loadPlayer();

let playerLat = 41.4089;
let playerLon = -75.6624;

 

let portalLayer = L.layerGroup().addTo(map);
let playerMarker = null;

function distance(lat1, lon1, lat2, lon2) {
  return (lat1 - lat2)**2 + (lon1 - lon2)**2;
}

async function capture(portalId) {

  if (playerLat == null || playerLon == null) {
    document.getElementById("status").innerText = "No location";
    return;
  }

  try {
      const res = await fetch(
  `/capture?portal_id=${portalId}&lat=${playerLat}&lon=${playerLon}&faction=${myplayerfaction}&owner=${playerName}`
  );  

    const data = await res.json();
    console.log(data);

    document.getElementById("status").innerText = data.status;

    await loadPortals(); // refresh map after capture
    await loadPlayer();

  } catch (err) {
    document.getElementById("status").innerText = "Error contacting server";
    console.error(err);
  }
}
  
function canCapture(p) {
  if (playerLat === null || playerLon === null) return false;

  // cannot capture your own faction
  if (p.controlled_by === myplayerfaction) return false;

  const d = distance(playerLat, playerLon, p.lat, p.lon);

  return d < 0.0005;
}
  
function updatePlayerMarker() {
  if (!playerMarker) {
    playerMarker = L.marker([playerLat, playerLon]).addTo(map);
  } else {
    playerMarker.setLatLng([playerLat, playerLon]);
  }
}

async function loadPortals() {
  const res = await fetch('/state');
  const data = await res.json();

  portalLayer.clearLayers();

  data.portals.forEach(p => {

    if (p.lat == null || p.lon == null) return;
    const eligible = canCapture(p);
    
    const color =
      p.controlled_by === "Knights" ? "red" :
      p.controlled_by === "Skylords" ? "blue" :
      p.controlled_by === "Elves" ? "green" :
      "gray";

  
  const marker = L.circleMarker([p.lat, p.lon], {
      radius: eligible ? 12 : 10,
      color: color,
      weight: eligible ? 6 : 2,
      fillColor: color,
      fillOpacity: 0.8
  }).addTo(portalLayer);

    if (eligible) {
       marker.setStyle({ fillColor: 'gold' });    }  
    
    let popupHTML = `
      Name ${p.portal_name}<br>
      Owner ${p.portal_owner}<br>
      Faction: ${p.controlled_by || "none"}<br>
    `;

    if (canCapture(p)) {
      popupHTML += `<button onclick="capture(${p.id})">Capture</button>`;
    }

    marker.bindPopup(popupHTML);
  });
}

updatePlayerMarker();
loadPortals();  
</script>

</body>
</html>
