<!DOCTYPE html>
<html>
<head>
  <title>Portal Game</title>
  <meta charset="utf-8" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
#map {
  height: 100vh;
  width: 100%;
}
#ui {
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 1000;

  background: rgba(255,255,255,0.9);
  padding: 12px 16px;
  border-radius: 10px;

  min-width: 140px;

  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  font-family: Arial, sans-serif;
}  </style>
</head>

<body>
<div id="map"></div>
<div id="ui">
  <button onclick="alert('capture mode')">Capture</button>
  <div id="status">Ready</div>
</div>
  
<script>
  // center on Scranton–Pittston area
  const map = L.map('map').setView([41.4, -75.7], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  async function loadPortals() {
    const res = await fetch('/state');
    const data = await res.json();

    data.portals.forEach(p => {
      if (p.lat && p.lon) {
        L.marker([p.lat, p.lon])
          .addTo(map)
          .bindPopup(
            `Portal ${p.portal_id}<br>Faction: ${p.controlled_by || "none"}`
          );
      }
    });
  }

  loadPortals();
</script>

</body>
</html>
