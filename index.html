<!DOCTYPE html>
<html>
<head>
  <title>Portal Game</title>
  <meta charset="utf-8" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>

<body>
<div id="map"></div>

<script>
  // center on Scranton–Pittston area
  const map = L.map('map').setView([41.4, -75.7], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  async function loadPortals() {
    const res = await fetch('/state');
    const data = await res.json();

    data.portals.forEach(p => {
      if (p.lat && p.lon) {
        L.marker([p.lat, p.lon])
          .addTo(map)
          .bindPopup(
            `Portal ${p.portal_id}<br>Faction: ${p.controlled_by || "none"}`
          );
      }
    });
  }

  loadPortals();
</script>

</body>
</html>
