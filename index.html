<!DOCTYPE html>
<html>
<head>
  <title>Portal Game</title>
  <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    
#map {
  height: 100dvh;
  width: 100%;
}
    
#ui {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;

  background: rgba(255,255,255,0.95);
  padding: 12px;
  border-radius: 12px;

  width: 90%;
  max-width: 400px;

  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  font-family: Arial, sans-serif;
  text-align: center;
}  </style>
</head>

<body>
<div id="map"></div>
<div id="ui">
  <div id="status">Ready</div>
  <button style="width:100%; padding:12px; font-size:16px;">
  Capture
</button>
</div>
  
<script>
  // center on Scranton–Pittston area
 const map = L.map('map').setView([41.4, -75.7], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
}).addTo(map);

let playerLat = 41.4107;
let playerLon = -75.6713;

let portalLayer = L.layerGroup().addTo(map);
let playerMarker = null;

function distance(lat1, lon1, lat2, lon2) {
  return (lat1 - lat2)**2 + (lon1 - lon2)**2;
}

async function capture(portalId) {

  if (playerLat == null || playerLon == null) {
    document.getElementById("status").innerText = "No location";
    return;
  }

  try {
    const res = await fetch(
      `/capture?portal_id=${portalId}&lat=${playerLat}&lon=${playerLon}&faction=red`
    );

    const data = await res.json();

    document.getElementById("status").innerText = data.status;

    loadPortals(); // refresh map after capture

  } catch (err) {
    document.getElementById("status").innerText = "Error contacting server";
    console.error(err);
  }
}
  
function canCapture(p) {
  if (p.controlled_by === "red") return false;
  if (playerLat === null) return false;

  const d = distance(playerLat, playerLon, p.lat, p.lon);
  return d < 0.0005;
}

function updatePlayerMarker() {
  if (!playerMarker) {
    playerMarker = L.marker([playerLat, playerLon]).addTo(map);
  } else {
    playerMarker.setLatLng([playerLat, playerLon]);
  }
}

async function loadPortals() {
  const res = await fetch('/state');
  const data = await res.json();

  portalLayer.clearLayers();

  data.portals.forEach(p => {

    if (p.lat == null || p.lon == null) return;

    const color =
      p.controlled_by === "red" ? "red" :
      p.controlled_by === "blue" ? "blue" :
      "gray";

    const marker = L.circleMarker([p.lat, p.lon], {
      radius: 8,
      color: color,
      fillColor: color,
      fillOpacity: 0.8
    }).addTo(portalLayer);

    let popupHTML = `
      Portal ${p.id}<br>
      Faction: ${p.controlled_by || "none"}<br>
    `;

    if (canCapture(p)) {
      popupHTML += `<button onclick="capture(${p.id})">Capture</button>`;
    }

    marker.bindPopup(popupHTML);
  });
}

updatePlayerMarker();
loadPortals();  
</script>

</body>
</html>
